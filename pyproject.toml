[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "keithley2231a"
version = "0.2.1.dev0"
description = "Python SCPI control for Keithley 2231A-30-3: serial/TCP, guarded SCPI and profiles"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["keithley", "2231a", "power-supply", "SCPI", "laboratory", "python", "UART"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["pyserial>=3.5", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]
